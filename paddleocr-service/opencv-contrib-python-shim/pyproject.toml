[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencv-contrib-python"
version = "4.10.0.84"
requires-python = ">=3.13"
dependencies = [
    "opencv-contrib-python-headless==4.10.0.84",
]

[tool.setuptools]
packages = ["opencv_contrib_python_shim"]